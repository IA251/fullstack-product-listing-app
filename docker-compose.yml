version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      # after entrypoint installs custom CA, point httpx to system bundle
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt

  frontend:
    build:
      context: ./frontend
    ports:
      - "5500:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html
